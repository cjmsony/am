<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号详情与加群</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            padding: 20px;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }
        .desc {
            font-size: 18px;
            color: #333;
            line-height: 1.8;
            margin-bottom: 30px;
            border-left: 4px solid #007bff;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .highlight { color: #d9534f; font-weight: bold; }

        .btn {
            display: inline-block;
            width: auto;
            padding: 18px 30px;
            background: #007bff;
            color: white !important;
            border-radius: 50px;
            font-weight: bold;
            font-size: 20px;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
            margin: 0 auto;
            cursor: pointer;
        }
        .btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="desc">
            🌍 <strong>海外国际帐号，☎各地区号码，高质量独享号，支持改密</strong><br><br>
            ⚠️ <span class="highlight">闲鱼/TB，非最终价格，介意请申请退款谢谢！</span><br><br>
            🐧 <strong>交流企鹅群</strong>：<span id="groupText"></span><br><br>
            🔍 能找到我们，就一定有你需要的。<br>
            🤖 千万别在咸鱼、淘宝 提问，敏感话题，感谢理解。<br>
            📝 TB/XY上面有很多是无法回复的，所以无人工，还请理解。
        </div>
        <div class="btn" id="joinBtn">售后点击一键加群</div>
    </div>

<script>
// 在这里统一配置群：群号 + qm一键加群链接，只改这里，页面显示和跳转自动同步
const groupList = [
    { num: "892351936", url: "https://qm.qq.com/q/yf94B4pgCQ" },
    { num: "1126639108", url: "https://qm.qq.com/q/rHegPoS15m" },
];

// 页面加载随机选取一个群
const randomItem = groupList[Math.floor(Math.random() * groupList.length)];

// 将群号渲染到页面文案
document.getElementById('groupText').innerText = randomItem.num;

// 按钮点击打开对应群链接
document.getElementById('joinBtn').onclick = function () {
    window.open(randomItem.url, "_blank");
};
</script>

</body>
</html>
